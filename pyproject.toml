[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mdlink-audit"
version = "0.1.0"
description = "Offline checks for repository Markdown links, headings, and case-sensitive paths."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "mdlink-audit contributors"}]
keywords = ["markdown", "links", "documentation", "ci", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["markdown-it-py>=3.0,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
mdlink-audit = "mdlink_audit.cli:main"

[project.urls]
Homepage = "https://github.com/christypixel68-cloud/mdlink-audit"
Issues = "https://github.com/christypixel68-cloud/mdlink-audit/issues"
Source = "https://github.com/christypixel68-cloud/mdlink-audit"

[tool.hatch.build.targets.wheel]
packages = ["src/mdlink_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
